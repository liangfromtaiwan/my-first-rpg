<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="door.png" />
  <title>2D RPG 地圖範例</title>
  <style>
    :root {
      color-scheme: light;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #1e1e1e;
      color: #000000;
      display: grid;
      place-items: center;
      min-height: 100vh;
      font-size: 18px;
    }

    .game-wrap {
      display: grid;
      gap: 12px;
      text-align: center;
      position: relative;
    }

    .main-layout {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      justify-content: center;
      flex-wrap: wrap;
    }

    .map-column {
      display: grid;
      gap: 8px;
      justify-items: center;
      position: relative;
    }

    .chat-panel {
      display: none;
      width: min(360px, 92vw);
      background: #ffffff;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 10px;
      text-align: left;
      height: 566px;
      align-self: flex-start;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-sizing: border-box;
      gap: 8px;
    }

    .chat-tabs {
      display: flex;
      gap: 6px;
    }

    .chat-tab {
      flex: 1;
      padding: 6px 8px;
      border: 1px solid #333;
      background: #ffffff;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }

    .chat-tab.is-active {
      background: #f0f0f0;
      font-weight: bold;
    }

    .chat-view {
      display: none;
      flex: 1;
      height: 94%;
      min-height: 0;
      flex-direction: column;
      gap: 8px;
    }

    .chat-view.is-active {
      display: flex;
    }

    .online-panel {
      border: 1px solid #ddd;
      background: #fafafa;
      border-radius: 6px;
      padding: 6px;
      display: grid;
      gap: 6px;
    }

    .online-title {
      font-weight: bold;
      font-size: 14px;
    }

    .online-list {
      display: grid;
      gap: 6px;
      max-height: 120px;
      overflow-y: auto;
      font-size: 14px;
    }

    .online-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .online-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #9e9e9e;
      border: 1px solid #777;
      flex-shrink: 0;
    }

    .online-dot.is-online {
      background: #2ecc71;
    }

    .chat-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      border: 1px solid #ddd;
      background: #fafafa;
      padding: 6px;
      gap: 8px;
      min-height: 0;
      overflow: hidden;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      font-size: 16px;
      min-height: 0;
    }

    .chat-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .chat-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      object-fit: cover;
      background: #ddd;
      flex-shrink: 0;
    }

    .private-chat {
      display: none;
      flex-direction: column;
      gap: 6px;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 6px;
      background: #fafafa;
    }

    .private-box {
      border: 1px solid #ddd;
      background: #ffffff;
      border-radius: 6px;
      padding: 4px;
      max-height: 220px;
      overflow: hidden;
    }

    .private-messages {
      max-height: 210px;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.4;
      text-align: left;
    }

    .private-input-row {
      display: flex;
      gap: 6px;
    }

    .private-input-row input {
      flex: 1;
      font-size: 14px;
      padding: 4px 6px;
      border: 1px solid #333;
      border-radius: 4px;
    }

    .private-input-row button {
      font-size: 14px;
      padding: 4px 8px;
      border: 1px solid #333;
      background: #ffffff;
      cursor: pointer;
    }

    .private-empty {
      font-size: 14px;
      color: #666;
      text-align: center;
      padding: 8px 0;
    }

    .chat-input-row {
      display: flex;
      gap: 6px;
    }

    .chat-input-row input {
      flex: 1;
      font-size: 16px;
      padding: 6px 8px;
      border: 1px solid #333;
      border-radius: 4px;
    }

    .chat-input-row button {
      font-size: 16px;
      padding: 6px 12px;
      border: 1px solid #333;
      background: #ffffff;
      cursor: pointer;
    }


    @media (max-width: 900px) {
      .main-layout {
        flex-direction: column;
        align-items: center;
      }
      .chat-panel {
        width: min(720px, 92vw);
        height: auto;
      }
    }

    .auth-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .auth-bar button {
      font-size: 18px;
      padding: 6px 12px;
      border: 1px solid #333;
      background: #ffffff;
      cursor: pointer;
    }

    .auth-bar button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .nickname-field {
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 18px;
    }

    .nickname-field input {
      font-size: 18px;
      padding: 4px 8px;
      border: 1px solid #333;
      border-radius: 4px;
    }

    h1 {
      font-size: 18px;
      margin: 0;
    }

    canvas {
      background: #2c3e50;
      border: 2px solid #f5f5f5;
      image-rendering: pixelated;
    }

    .video-wrap {
      width: min(720px, 92vw);
      height: min(60vh, 420px);
      background: #ffffff;
      border: 1px solid #333;
      border-radius: 6px;
      overflow: hidden;
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.35);
    }

    .video-wrap iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .video-placeholder {
      padding: 12px;
      font-size: 14px;
      text-align: center;
      color: #333;
    }

    .call-start {
      position: fixed;
      z-index: 25;
      padding: 6px 10px;
      font-size: 14px;
      border: 2px solid #333;
      background: #ffffff;
      border-radius: 8px;
      cursor: pointer;
      display: none;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.25);
    }

    .video-room-url {
      font-size: 12px;
      color: #333;
      padding: 0 12px 8px;
      word-break: break-all;
      display: none;
    }

    .hint {
      font-size: 18px;
      color: #000000;
    }


  </style>
</head>

<body>
  <div class="game-wrap">
    <h1>最簡單 2D RPG 地圖範例</h1>
    <div class="auth-bar" aria-live="polite">
      <span id="auth-status">尚未登入</span>
      <label class="nickname-field" for="nickname-input">
        暱稱
        <input id="nickname-input" type="text" maxlength="12" placeholder="輸入暱稱" />
      </label>
      <button id="google-login" type="button">Google 登入</button>
      <button id="anon-login" type="button">匿名登入</button>
    </div>
    <div class="main-layout">
      <div class="map-column">
        <div class="video-wrap" id="video-wrap">
          <div class="video-placeholder" id="video-placeholder">
            視訊準備中...
          </div>
          <div class="video-room-url" id="video-room-url"></div>
          <iframe
            id="daily-frame"
            allow="camera; microphone; fullscreen; speaker; display-capture"
          ></iframe>
        </div>
        <canvas id="game" width="400" height="300" aria-label="遊戲畫面"></canvas>
        <div class="hint">方向鍵移動，面向 NPC 按 Enter 對話</div>
        <button class="call-start" id="call-start" type="button">開始通話 ↲</button>
      </div>
      <div class="chat-panel" id="chat-panel" aria-live="polite">
        <div class="chat-tabs">
          <button class="chat-tab is-active" id="tab-map" type="button">
            地圖
          </button>
          <button class="chat-tab" id="tab-private" type="button">
            兩人對話
          </button>
        </div>
        <div class="chat-view is-active" id="chat-view-map">
          <div class="online-panel" id="online-panel">
            <div class="online-title">村莊使用者</div>
            <div class="online-list" id="online-list"></div>
          </div>
          <div class="chat-box">
            <div class="chat-messages" id="chat-messages"></div>
          </div>
          <div class="chat-input-row">
            <input id="chat-input" type="text" maxlength="120" placeholder="輸入訊息..." />
            <button id="chat-send" type="button">送出</button>
          </div>
        </div>
        <div class="chat-view" id="chat-view-private">
          <div class="private-chat" id="private-chat">
            <div class="private-box">
              <div class="private-messages" id="private-messages"></div>
            </div>
            <div class="private-empty" id="private-empty">
              靠近玩家即可開始私聊
            </div>
            <div class="private-input-row">
              <input id="private-input" type="text" maxlength="60" placeholder="私聊..." />
              <button id="private-send" type="button">送出</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <audio id="message-send-audio" src="message-send.mp3" preload="auto"></audio>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      onAuthStateChanged,
      signInAnonymously,
      signInWithPopup,
    } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";
    import {
      addDoc,
      collection,
      doc,
      getFirestore,
      onSnapshot,
      orderBy,
      query,
      setDoc,
      serverTimestamp,
      updateDoc,
      where,
    } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBVxpNlHDSOxe64nSwVqvSpaClA5G4ItRM",
      authDomain: "social-village-game.firebaseapp.com",
      projectId: "social-village-game",
      storageBucket: "social-village-game.firebasestorage.app",
      messagingSenderId: "678566991092",
      appId: "1:678566991092:web:fa6990a54476d815183aa1",
    };

    const firebaseApp = initializeApp(firebaseConfig);
    const auth = getAuth(firebaseApp);
    const db = getFirestore(firebaseApp);
    const provider = new GoogleAuthProvider();

    const authStatus = document.querySelector("#auth-status");
    const googleLoginButton = document.querySelector("#google-login");
    const anonLoginButton = document.querySelector("#anon-login");
    const nicknameField = document.querySelector(".nickname-field");
    const nicknameInput = document.querySelector("#nickname-input");
    const chatPanel = document.querySelector("#chat-panel");
    const chatMessages = document.querySelector("#chat-messages");
    const chatInput = document.querySelector("#chat-input");
    const chatSend = document.querySelector("#chat-send");
    const tabMap = document.querySelector("#tab-map");
    const tabPrivate = document.querySelector("#tab-private");
    const chatViewMap = document.querySelector("#chat-view-map");
    const chatViewPrivate = document.querySelector("#chat-view-private");
    const onlinePanel = document.querySelector("#online-panel");
    const onlineList = document.querySelector("#online-list");
    const videoWrap = document.querySelector("#video-wrap");
    const videoPlaceholder = document.querySelector("#video-placeholder");
    const videoRoomUrl = document.querySelector("#video-room-url");
    const dailyFrame = document.querySelector("#daily-frame");
    const callStart = document.querySelector("#call-start");
    const privateChat = document.querySelector("#private-chat");
    const privateMessagesEl = document.querySelector("#private-messages");
    const privateEmpty = document.querySelector("#private-empty");
    const privateInput = document.querySelector("#private-input");
    const privateSend = document.querySelector("#private-send");
    const messageSendAudio = document.querySelector("#message-send-audio");
    const nicknameStorageKey = "playerNickname";
    let playerNickname = localStorage.getItem(nicknameStorageKey) || "";
    nicknameInput.value = playerNickname;
    // 每個聊天室對應一個 villageId（需求指定為 'lgbtq'）
    const villageId = "lgbtq";
    let unsubscribeChat = null;
    let unsubscribePlayers = null;
    const otherPlayers = new Map();
    const avatarCache = new Map();
    const otherPlayerRender = new Map();
    let activePrivateChatId = null;
    let activePrivatePartner = null;
    let privateMessages = [];
    let unsubscribePrivate = null;
    let unsubscribeCall = null;
    let activeCallId = null;
    let activeCallData = null;
    let unsubscribeUsers = null;
    const onlineUsers = new Map();
    let onlineRefreshTimer = null;
    let activeChatTab = "map";
    let userSelectedTab = false;
    const jitsiRoomBaseUrl = "https://meet.jit.si";
    let lastPresenceUpdate = 0;
    const presenceIntervalMs = 800;

    const setAuthStatus = (user) => {
      if (user) {
        const name =
          user.displayName ||
          user.isAnonymous && "匿名玩家" ||
          "玩家";
        authStatus.textContent = `你好，${name}`;
        googleLoginButton.disabled = true;
        anonLoginButton.disabled = true;
        nicknameField.style.display = "flex";
      } else {
        authStatus.textContent = "尚未登入";
        googleLoginButton.disabled = false;
        anonLoginButton.disabled = false;
        nicknameField.style.display = "none";
      }
    };

    const handleAuthError = (error) => {
      const code = error?.code || "unknown";
      let message = "登入失敗，請稍後再試。";
      if (code === "auth/unauthorized-domain") {
        message = "此網域未授權，請到 Firebase 加入此網域。";
      } else if (code === "auth/popup-blocked") {
        message = "瀏覽器阻擋彈窗，請允許彈窗再試。";
      } else if (code === "auth/popup-closed-by-user") {
        message = "你已關閉登入視窗。";
      } else if (code === "auth/operation-not-allowed") {
        message = "此登入方式未啟用，請到 Firebase 開啟。";
      } else if (code === "auth/network-request-failed") {
        message = "網路連線失敗，請檢查網路。";
      } else if (code === "auth/invalid-api-key") {
        message = "Firebase 設定有誤，請確認 apiKey。";
      }
      authStatus.textContent = message;
      googleLoginButton.disabled = false;
      anonLoginButton.disabled = false;
      console.error("登入失敗", error);
    };

    googleLoginButton.addEventListener("click", async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        handleAuthError(error);
      }
    });

    anonLoginButton.addEventListener("click", async () => {
      try {
        await signInAnonymously(auth);
      } catch (error) {
        handleAuthError(error);
      }
    });

    onAuthStateChanged(auth, setAuthStatus);
    onAuthStateChanged(auth, () => {
      startPlayersListener();
    });

    if (window.location.protocol === "file:") {
      authStatus.textContent =
        "Google 登入需要 http/https，請用本機伺服器或 GitHub Pages 開啟。";
    }

    nicknameInput.addEventListener("input", () => {
      playerNickname = nicknameInput.value.trim();
      localStorage.setItem(nicknameStorageKey, playerNickname);
    });

    const appendChatMessage = (message) => {
      const row = document.createElement("div");
      row.className = "chat-row";

      const avatar = document.createElement("img");
      avatar.className = "chat-avatar";
      avatar.alt = "avatar";
      if (message.photoURL) {
        avatar.src = message.photoURL;
      }

      const text = document.createElement("div");
      text.textContent = `${message.userName}: ${message.text}`;

      row.appendChild(avatar);
      row.appendChild(text);
      chatMessages.appendChild(row);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    };

    const clearChatMessages = () => {
      chatMessages.innerHTML = "";
    };

    const showChatStatus = (text) => {
      const row = document.createElement("div");
      row.textContent = text;
      row.style.color = "#666";
      chatMessages.appendChild(row);
    };

    const startChatListener = () => {
      if (unsubscribeChat) {
        unsubscribeChat();
      }
      clearChatMessages();

      // 即時監聽村莊訊息，依時間排序
      const messagesRef = collection(db, "messages");
      // 不使用 orderBy 以避免需要建立索引
      const messagesQuery = query(messagesRef, where("villageId", "==", villageId));

      unsubscribeChat = onSnapshot(
        messagesQuery,
        (snapshot) => {
          clearChatMessages();
          if (snapshot.empty) {
            showChatStatus("目前還沒有訊息");
            return;
          }
          const rows = [];
          snapshot.forEach((doc) => {
            rows.push(doc.data());
          });
          rows.sort((a, b) => {
            const aTime = a.createdAt?.toMillis ? a.createdAt.toMillis() : 0;
            const bTime = b.createdAt?.toMillis ? b.createdAt.toMillis() : 0;
            return aTime - bTime;
          });
          rows.forEach((row) => appendChatMessage(row));
        },
        (error) => {
          clearChatMessages();
          if (error?.code === "permission-denied") {
            showChatStatus("讀取被 Firebase 規則擋住，請確認 rules。");
          } else {
            showChatStatus("讀取訊息失敗，請稍後再試。");
          }
          console.error("聊天室讀取失敗", error);
        }
      );
    };

    const stopChatListener = () => {
      if (unsubscribeChat) {
        unsubscribeChat();
        unsubscribeChat = null;
      }
      clearChatMessages();
    };

    const getConversationId = (uidA, uidB) => {
      return [uidA, uidB].sort().join("_");
    };

    const startPrivateListener = (conversationId) => {
      if (unsubscribePrivate) {
        unsubscribePrivate();
      }
      privateMessages = [];
      const ref = collection(db, "privateMessages");
      const privateQuery = query(ref, where("conversationId", "==", conversationId));
      unsubscribePrivate = onSnapshot(
        privateQuery,
        (snapshot) => {
          privateMessages = [];
          snapshot.forEach((docSnap) => {
            privateMessages.push(docSnap.data());
          });
          privateMessages.sort((a, b) => {
            const aTime = a.createdAt?.toMillis ? a.createdAt.toMillis() : 0;
            const bTime = b.createdAt?.toMillis ? b.createdAt.toMillis() : 0;
            return aTime - bTime;
          });
          renderPrivateMessages();
        },
        (error) => {
          console.error("私聊讀取失敗", error);
        }
      );
    };

    const stopPrivateListener = () => {
      if (unsubscribePrivate) {
        unsubscribePrivate();
        unsubscribePrivate = null;
      }
      privateMessages = [];
      renderPrivateMessages();
    };

    const renderPrivateMessages = () => {
      if (!privateMessagesEl) {
        return;
      }
      privateMessagesEl.innerHTML = "";
      privateMessages.forEach((message) => {
        const row = document.createElement("div");
        row.textContent = `${message.fromName || "玩家"}：${message.text || ""}`;
        privateMessagesEl.appendChild(row);
      });
      privateMessagesEl.scrollTop = privateMessagesEl.scrollHeight;
    };

    const setPrivateAvailability = (isAvailable) => {
      if (!privateChat) {
        return;
      }
      privateChat.style.display = "flex";
      if (privateEmpty) {
        privateEmpty.style.display = isAvailable ? "none" : "block";
      }
      if (privateMessagesEl) {
        privateMessagesEl.parentElement.style.display = isAvailable
          ? "block"
          : "none";
      }
      if (privateInput) {
        privateInput.disabled = !isAvailable;
      }
      if (privateSend) {
        privateSend.disabled = !isAvailable;
      }
    };

    const startCallListener = async (conversationId, partnerId) => {
      if (unsubscribeCall) {
        unsubscribeCall();
      }
      activeCallId = conversationId;
      const callRef = doc(db, "calls", conversationId);
      const user = auth.currentUser;
      if (!user) {
        return;
      }
      await setDoc(
        callRef,
        {
          conversationId,
          participants: [user.uid, partnerId],
          status: "pending",
          acceptedBy: {},
          roomUrl: "",
        },
        { merge: true }
      );
      unsubscribeCall = onSnapshot(
        callRef,
        (docSnap) => {
          activeCallData = docSnap.exists() ? docSnap.data() : null;
          if (!activeCallData) {
            return;
          }
          const acceptedBy = activeCallData.acceptedBy || {};
          const isAcceptedBySelf = Boolean(acceptedBy[user.uid]);
          const isAcceptedByOther = Boolean(acceptedBy[partnerId]);
          const bothAccepted = isAcceptedBySelf && isAcceptedByOther;
          const desiredRoomUrl = buildJitsiRoomUrl(conversationId);
          if (bothAccepted && desiredRoomUrl && activeCallData.roomUrl !== desiredRoomUrl) {
            const isOwner = user.uid < partnerId;
            if (isOwner) {
              updateDoc(callRef, {
                status: "active",
                roomUrl: desiredRoomUrl,
              }).catch((error) => {
                console.error("更新通話房間失敗", error);
              });
            }
          }
          if (bothAccepted && activeCallData.roomUrl) {
            showVideoRoom(activeCallData.roomUrl);
          } else {
            hideVideoRoom();
          }
          setCallStartVisibility(Boolean(activePrivatePartner && canAcceptCall()));
          positionCallStart();
        },
        (error) => {
          console.error("通話狀態讀取失敗", error);
        }
      );
    };

    const stopCallListener = () => {
      if (unsubscribeCall) {
        unsubscribeCall();
        unsubscribeCall = null;
      }
      activeCallId = null;
      activeCallData = null;
      hideVideoRoom();
      setCallStartVisibility(false);
    };

    const canAcceptCall = () => {
      const user = auth.currentUser;
      if (!user || !activeCallId || !activeCallData) {
        return false;
      }
      const acceptedBy = activeCallData.acceptedBy || {};
      return !acceptedBy[user.uid];
    };

    const acceptCall = async () => {
      const user = auth.currentUser;
      if (!user || !activeCallId) {
        return;
      }
      try {
        await setDoc(
          doc(db, "calls", activeCallId),
          {
            acceptedBy: {
              [user.uid]: true,
            },
          },
          { merge: true }
        );
      } catch (error) {
        console.error("接受通話失敗", error);
      }
    };

    const setCallStartVisibility = (visible) => {
      if (!callStart) {
        return;
      }
      callStart.style.display = visible ? "inline-flex" : "none";
    };

    const positionCallStart = () => {
      if (!callStart || !activePrivatePartner) {
        return;
      }
      const rect = canvas.getBoundingClientRect();
      const scaleX = rect.width / canvas.width;
      const scaleY = rect.height / canvas.height;
      const x =

      const normalized = hex.replace("#", "");

      return {
        r: (value >> 16) & 255,
        g: (value >> 8) & 255,
        b: value & 255,
      };

    const prepareTreeSprite = () => {
      if (!treeImage.complete) {
        return;

      treeSprite.width = treeImage.width;
      treeSprite.height = treeImage.height;
      treeSpriteCtx.clearRect(0, 0, treeSprite.width, treeSprite.height);
      treeSpriteCtx.drawImage(treeImage, 0, 0);

      const imageData = treeSpriteCtx.getImageData(
        0,
        0,
        treeSprite.width,
        treeSprite.height
      );
      const data = imageData.data;
      const bg = [data[0], data[1], data[2], data[3]];
      const target = hexToRgb(treeBackgroundColor);

      for (let i = 0; i < data.length; i += 4) {
        if (
          data[i] === bg[0] &&
          data[i + 1] === bg[1] &&
          data[i + 2] === bg[2] &&
          data[i + 3] === bg[3]
        ) {
          data[i] = target.r;
          data[i + 1] = target.g;
          data[i + 2] = target.b;
          data[i + 3] = 255;
        }
      }

      treeSpriteCtx.putImageData(imageData, 0, 0);
      treeSpriteReady = true;

      let line = "";
      for (const char of text) {
        const testLine = line + char;
        if (context.measureText(testLine).width > maxWidth && line) {
          lines.push(line);
          line = char;
        } else {
          line = testLine;
        }
      }
      if (line) {
        lines.push(line);
      }
      return lines;

    const generateCrowdForMap = (mapName) => {
      const mapData = maps[mapName];
      if (!mapData || mapData.crowd.length) {
        return;
      }

      const crowdCount = getRandomInt(3, 5);
      const usedTiles = new Set();
      const blockedTiles = new Set();

      if (mapData.npc) {
        blockedTiles.add(`${mapData.npc.tileX},${mapData.npc.tileY}`);
      }
      if (mapData.entrance) {
        blockedTiles.add(`${mapData.entrance.x},${mapData.entrance.y}`);
      }
      if (mapData.exit) {
        blockedTiles.add(`${mapData.exit.x},${mapData.exit.y}`);
      }
      if (mapData.exitArea && mapData.exitArea.length) {
        mapData.exitArea.forEach((tile) => {
          blockedTiles.add(`${tile.x},${tile.y}`);
        });
      }
      if (mapData.spawn) {
        blockedTiles.add(`${mapData.spawn.x},${mapData.spawn.y}`);
      }

      const colors = ["#3498db", "#9b59b6", "#e67e22", "#1abc9c", "#f1c40f"];
      let attempts = 0;

      while (mapData.crowd.length < crowdCount && attempts < 300) {
        attempts += 1;
        const tileX = getRandomInt(1, mapCols - 2);
        const tileY = getRandomInt(1, mapRows - 2);
        const key = `${tileX},${tileY}`;

        if (blockedTiles.has(key) || usedTiles.has(key)) {
          continue;
        }
        if (mapData.tiles[tileY][tileX] === 1) {
          continue;
        }
        if (mapName === "worldMap") {
          const castleRect = getCastleRect();
          if (castleRect) {
            const tileCenter = {
              x: tileX * tileSize + tileSize / 2,
              y: tileY * tileSize + tileSize / 2,
              size: 1,
            };
            if (rectsOverlap(tileCenter, castleRect)) {
              continue;
            }
          }
        }

        usedTiles.add(key);
        mapData.crowd.push({
          tileX,
          tileY,
          color: colors[mapData.crowd.length % colors.length],
        });
      }
    };

        player.y = spawn.y * tileSize;
      }
      generateCrowdForMap(mapName);
      isDialogueOpen = false;
      dialogueStage = "question";
      selectedOption = 0;
      resultMessage = "";
      updateChatVisibility();
      startPlayersListener();
      updateUserPresence();
    };

    const isWall = (tileX, tileY) => {
      if (tileX < 0 || tileX >= mapCols || tileY < 0 || tileY >= mapRows) {
        return true;
      }
      return currentMap.tiles[tileY][tileX] === 1;
    };

    const drawRoundedRect = (ctx, x, y, width, height, radius) => {
      const r = Math.min(radius, width / 2, height / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + width, y, x + width, y + height, r);
      ctx.arcTo(x + width, y + height, x, y + height, r);
      ctx.arcTo(x, y + height, x, y, r);
      ctx.arcTo(x, y, x + width, y, r);
      ctx.closePath();
    };

    const drawNameBubble = (ctx, centerX, topY, label, isOnline) => {
      const fontSize = 14;
      const paddingX = 10;
      const paddingY = 6;
      const dotRadius = 5;
      const dotGap = 6;
      const text = label || "";

      ctx.save();
      ctx.font = `${fontSize}px Arial, Helvetica, sans-serif`;
      const textWidth = ctx.measureText(text).width;
      const bubbleHeight = fontSize + paddingY * 2;
      const bubbleWidth =
        textWidth + paddingX * 2 + dotRadius * 2 + dotGap;
      const bubbleX = centerX - bubbleWidth / 2;
      const bubbleY = topY - bubbleHeight - 10;

      ctx.fillStyle = "#6a4bdc";
      drawRoundedRect(ctx, bubbleX, bubbleY, bubbleWidth, bubbleHeight, 10);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(centerX - 6, bubbleY + bubbleHeight);
      ctx.lineTo(centerX, bubbleY + bubbleHeight + 8);
      ctx.lineTo(centerX + 6, bubbleY + bubbleHeight);
      ctx.closePath();
      ctx.fill();

      const dotX = bubbleX + paddingX + dotRadius;
      const dotY = bubbleY + bubbleHeight / 2;
      ctx.fillStyle = isOnline ? "#2ecc71" : "#9e9e9e";
      ctx.beginPath();
      ctx.arc(dotX, dotY, dotRadius, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillText(
        text,
        dotX + dotRadius + dotGap,
        bubbleY + bubbleHeight / 2
      );
      ctx.restore();
    };

    const isUserOnline = (uid) => {
      if (!uid) {
        return false;
      }
      const data = onlineUsers.get(uid);
      const lastActiveMs = data?.lastActiveAt?.toMillis
        ? data.lastActiveAt.toMillis()
        : 0;
      return Date.now() - lastActiveMs < 5 * 60 * 1000;
    };

    const rectsOverlap = (a, b) =>
      a.x < b.x + b.size &&
      a.x + a.size > b.x &&
      a.y < b.y + b.size &&
      a.y + a.size > b.y;

    const getCrowdRect = (member) => {
      const sprite = getCrowdSpriteStyle(member.color);
      const offset = Math.floor((tileSize - sprite.size) / 2);
      return {
        x: member.tileX * tileSize + offset,
        y: member.tileY * tileSize + offset,
        size: sprite.size,
      };
    };

    const getCastleDrawInfo = () => {
      if (currentMapName !== "worldMap" || !currentMap.entrance) {
        return null;
      }
      const image = castleImage.complete ? castleImage : doorImage;
      if (!image.complete) {
        return null;
      }
      const isCastle = image === castleImage;
      const scale = isCastle ? 5 : 1;
      const size = tileSize * scale;
      const x =
        currentMap.entrance.x * tileSize -
        (size - tileSize) / 2 -
        tileSize * 5;
      const y =
        currentMap.entrance.y * tileSize -
        (size - tileSize) -
        tileSize * 2;
      return { image, x, y, size, isCastle };
    };

    const getCastleRect = () => {
      const info = getCastleDrawInfo();
      if (!info || !info.isCastle) {
        return null;
      }
      return {
        x: info.x,
        y: info.y,
        size: info.size,
      };
    };

    const getCastleEntranceZone = () => {
      const castleRect = getCastleRect();
      if (!castleRect) {
        return null;
      }
      const zoneWidth = tileSize * 1.4;
      const zoneHeight = tileSize * 0.7;
      return {
        x: castleRect.x + (castleRect.size - zoneWidth) / 2,
        y: castleRect.y + castleRect.size,
        size: zoneWidth,
        height: zoneHeight,
      };
    };

    generateCrowdForMap(currentMapName);
    updateChatVisibility();
    startPlayersListener();

    const canMoveTo = (x, y) => {
      const left = Math.floor(x / tileSize);
      const right = Math.floor((x + player.size - 1) / tileSize);
      const top = Math.floor(y / tileSize);
      const bottom = Math.floor((y + player.size - 1) / tileSize);

      const hitsWall =
        isWall(left, top) ||
        isWall(right, top) ||
        isWall(left, bottom) ||
        isWall(right, bottom);

      if (hitsWall) {
        return false;
      }

      const nextPlayerRect = {
        x,
        y,
        size: player.size,
      };

      const castleRect = getCastleRect();
      if (castleRect && rectsOverlap(nextPlayerRect, castleRect)) {
        return false;
      }

      if (currentMap.crowd.length) {
        const blockedByCrowd = currentMap.crowd.some((member) =>
          rectsOverlap(nextPlayerRect, getCrowdRect(member))
        );
        if (blockedByCrowd) {
          return false;
        }
      }

      if (npc.active) {
        const npcRect = {
          x: npcPixel.x,
          y: npcPixel.y,
          size: npc.size,
        };
        if (rectsOverlap(nextPlayerRect, npcRect)) {
          return false;
        }
      }

      return true;
    };

    const getPlayerTile = () => ({
      x: Math.floor((player.x + player.size / 2) / tileSize),
      y: Math.floor((player.y + player.size / 2) / tileSize),
    });

    const getPlayerCenter = () => ({
      x: player.x + player.size / 2,
      y: player.y + player.size / 2,
    });

    const isPlayerFacingNpc = () => {
      const playerTile = getPlayerTile();
      let frontTile = {
        x: playerTile.x,
        y: playerTile.y,
      };

      if (player.facing === "up") frontTile.y -= 1;
      if (player.facing === "down") frontTile.y += 1;
      if (player.facing === "left") frontTile.x -= 1;
      if (player.facing === "right") frontTile.x += 1;

      if (!npc.active) {
        return false;
      }

      return frontTile.x === npc.tileX && frontTile.y === npc.tileY;
    };

    const isPlayerNearNpc = () => {
      if (!npc.active) {
        return false;
      }
      const playerCenter = getPlayerCenter();
      const npcCenter = {
        x: npcPixel.x + npc.size / 2,
        y: npcPixel.y + npc.size / 2,
      };
      const distance = Math.hypot(
        playerCenter.x - npcCenter.x,
        playerCenter.y - npcCenter.y
      );
      return distance <= tileSize * 1.2;
    };

    const isExitTile = (mapData, tileX, tileY) => {
      if (mapData.exitArea && mapData.exitArea.length) {
        return mapData.exitArea.some(
          (tile) => tile.x === tileX && tile.y === tileY
        );
      }
      return (
        mapData.exit && mapData.exit.x === tileX && mapData.exit.y === tileY
      );
    };

    const checkMapTransition = () => {
      const playerTile = getPlayerTile();
      const playerRect = {
        x: player.x,
        y: player.y,
        size: player.size,
      };
      const castleEntranceZone = getCastleEntranceZone();
      if (
        currentMapName === "worldMap" &&
        ((currentMap.entrance &&
          playerTile.x === currentMap.entrance.x &&
          playerTile.y === currentMap.entrance.y) ||
          (castleEntranceZone &&
            playerRect.x + playerRect.size > castleEntranceZone.x &&
            playerRect.x < castleEntranceZone.x + castleEntranceZone.size &&
            playerRect.y + playerRect.size > castleEntranceZone.y &&
            playerRect.y < castleEntranceZone.y + castleEntranceZone.height))
      ) {
        setMap("villageMap", maps.villageMap.spawn);
        player.facing = "down";
      }

      if (
        currentMapName === "villageMap" &&
        isExitTile(currentMap, playerTile.x, playerTile.y)
      ) {
        setMap("worldMap", maps.worldMap.spawn);
        player.facing = "down";
      }
    };

    const update = () => {
      if (isDialogueOpen) {
        return;
      }

      let dx = 0;
      let dy = 0;

      if (keys.ArrowUp) dy -= player.speed;
      if (keys.ArrowDown) dy += player.speed;
      if (keys.ArrowLeft) dx -= player.speed;
      if (keys.ArrowRight) dx += player.speed;

      if (dx === 0 && dy === 0 && moveTarget.x !== null) {
        const diffX = moveTarget.x - player.x;
        const diffY = moveTarget.y - player.y;
        const distance = Math.hypot(diffX, diffY);
        if (distance <= player.speed) {
          dx = diffX;
          dy = diffY;
          moveTarget.x = null;
          moveTarget.y = null;
        } else {
          dx = (diffX / distance) * player.speed;
          dy = (diffY / distance) * player.speed;
        }
      }

      if (dy < 0) player.facing = "up";
      if (dy > 0) player.facing = "down";
      if (dx < 0) player.facing = "left";
      if (dx > 0) player.facing = "right";

      const nextX = clamp(player.x + dx, 0, canvas.width - player.size);
      const nextY = clamp(player.y + dy, 0, canvas.height - player.size);

      if (canMoveTo(nextX, player.y)) {
        player.x = nextX;
      }

      if (canMoveTo(player.x, nextY)) {
        player.y = nextY;
      }

      checkMapTransition();

      // 將玩家位置同步到 Firestore（簡單多人同步）
      const now = performance.now();
      if (auth.currentUser && now - lastPresenceUpdate > presenceIntervalMs) {
        lastPresenceUpdate = now;
        setDoc(
          doc(db, "players", auth.currentUser.uid),
          {
            userName:
              playerNickname ||
              auth.currentUser.displayName ||
              (auth.currentUser.isAnonymous ? "匿名玩家" : "玩家"),
            photoURL: auth.currentUser.photoURL || "",
            mapName: currentMapName,
            x: player.x,
            y: player.y,
            updatedAt: serverTimestamp(),
          },
          { merge: true }
        ).catch((error) => {
          console.error("玩家位置同步失敗", error);
        });
      }

      // 依距離決定是否開啟私聊
      let nearest = null;
      let nearestDist = Infinity;
      otherPlayers.forEach((playerData, playerId) => {
        if (
          typeof playerData.x !== "number" ||
          typeof playerData.y !== "number"
        ) {
          return;
        }
        const dx = playerData.x - player.x;
        const dy = playerData.y - player.y;
        const dist = Math.hypot(dx, dy);
        if (dist < nearestDist) {
          nearestDist = dist;
          nearest = { id: playerId, data: playerData };
        }
      });

      if (nearest && nearestDist < tileSize * 1.6) {
        const user = auth.currentUser;
        if (user) {
          const conversationId = getConversationId(user.uid, nearest.id);
          if (conversationId !== activePrivateChatId) {
            activePrivateChatId = conversationId;
            activePrivatePartner = {
              uid: nearest.id,
              name: nearest.data.userName || "玩家",
              x: nearest.data.x,
              y: nearest.data.y,
            };
            startPrivateListener(conversationId);
            startCallListener(conversationId, nearest.id);
          }
          setPrivateAvailability(true);
          if (!userSelectedTab && activeChatTab !== "private") {
            activeChatTab = "private";
            updateChatTabs();
          }
        }
      } else {
        activePrivateChatId = null;
        activePrivatePartner = null;
        stopPrivateListener();
        stopCallListener();
        setPrivateAvailability(false);
        if (!userSelectedTab && activeChatTab !== "map") {
          activeChatTab = "map";
          updateChatTabs();
        }
      }
    };

    const render = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let row = 0; row < mapRows; row += 1) {
        for (let col = 0; col < mapCols; col += 1) {
          const tile = currentMap.tiles[row][col];
          const floorColor =
            currentMapName === "villageMap" ? "#c7d6b7" : "#b7d3c2";
          if (tile === 1) {
            if (treeSpriteReady) {
              ctx.drawImage(
                treeSprite,
                col * tileSize,
                row * tileSize,
                tileSize,
                tileSize
              );
            }
          } else {
            ctx.fillStyle = floorColor;
            ctx.fillRect(
              col * tileSize,
              row * tileSize,
              tileSize,
              tileSize
            );
          }
        }
      }

      const castleInfo = getCastleDrawInfo();
      if (castleInfo) {
        ctx.drawImage(
          castleInfo.image,
          castleInfo.x,
          castleInfo.y,
          castleInfo.size,
          castleInfo.size
        );
      }

      if (doorImage.complete) {
        if (currentMapName === "villageMap") {
          const doorTile = currentMap.exit || currentMap.exitArea?.[0];
          if (doorTile) {
            ctx.drawImage(
              doorImage,
              doorTile.x * tileSize,
              doorTile.y * tileSize,
              tileSize,
              tileSize
            );
          }
        }
      }

      if (currentMap.crowd.length) {
        currentMap.crowd.forEach((member) => {
          const sprite = getCrowdSpriteStyle(member.color);
          const offset = Math.floor((tileSize - sprite.size) / 2);
          const baseX = member.tileX * tileSize + offset;
          const baseY = member.tileY * tileSize + offset;
          const headRadius = sprite.size * 0.22;
          const headCenterX = baseX + sprite.size / 2;
          const headCenterY = baseY + headRadius + 2;
          const bodyWidth = sprite.size * 0.55;
          const bodyHeight = sprite.size * 0.45;
          const bodyX = baseX + (sprite.size - bodyWidth) / 2;
          const bodyY = headCenterY + headRadius + 2;

          ctx.fillStyle = sprite.color;
          ctx.beginPath();
          ctx.arc(headCenterX, headCenterY, headRadius, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillRect(bodyX, bodyY, bodyWidth, bodyHeight);
        });
      }

      if (otherPlayers.size) {
        otherPlayers.forEach((playerData, playerId) => {
          if (
            typeof playerData.x !== "number" ||
            typeof playerData.y !== "number"
          ) {
            return;
          }
          const renderPos = otherPlayerRender.get(playerId) || {
            x: playerData.x,
            y: playerData.y,
          };
          const smoothFactor = 0.12;
          renderPos.x += (playerData.x - renderPos.x) * smoothFactor;
          renderPos.y += (playerData.y - renderPos.y) * smoothFactor;
          otherPlayerRender.set(playerId, renderPos);

          const avatar = getAvatarImage(playerData.photoURL);
          if (avatar && avatar.complete) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(
              renderPos.x + player.size / 2,
              renderPos.y + player.size / 2,
              player.size / 2,
              0,
              Math.PI * 2
            );
            ctx.clip();
            ctx.drawImage(
              avatar,
              renderPos.x,
              renderPos.y,
              player.size,
              player.size
            );
            ctx.restore();
          } else {
            ctx.fillStyle = "#3498db";
            ctx.beginPath();
            ctx.arc(
              renderPos.x + player.size / 2,
              renderPos.y + player.size / 2,
              player.size * 0.35,
              0,
              Math.PI * 2
            );
            ctx.fill();
          }

          const otherName =
            playerData.userName ||
            playerData.displayName ||
            "玩家";
          if (otherName) {
            drawNameBubble(
              ctx,
              renderPos.x + player.size / 2,
              renderPos.y - 6,
              otherName,
              isUserOnline(playerId)
            );
          }
        });
      }

      // 私聊訊息改顯示在右側面板，避免與名字重疊

      if (currentMap.crowd.length) {
        const playerCenter = getPlayerCenter();
        const hintRadius = tileSize * 1.1;

        currentMap.crowd.forEach((member) => {
          const memberCenter = {
            x: member.tileX * tileSize + tileSize / 2,
            y: member.tileY * tileSize + tileSize / 2,
          };
          const distance = Math.hypot(
            playerCenter.x - memberCenter.x,
            playerCenter.y - memberCenter.y
          );
          if (distance > hintRadius) {
            return;
          }

          ctx.save();
          ctx.fillStyle = "#000000";
          ctx.font = "18px Arial, Helvetica, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "bottom";
          ctx.fillText(
            "👋 揮手",
            memberCenter.x,
            memberCenter.y - tileSize * 0.6
          );
          ctx.restore();
        });
      }

      if (activePrivatePartner && canAcceptCall()) {
        setCallStartVisibility(true);
        positionCallStart();
      } else {
        setCallStartVisibility(false);
      }

      if (npc.active && npcImage.complete) {
        ctx.drawImage(npcImage, npcPixel.x, npcPixel.y, npc.size, npc.size);
      }

      const selfAvatar = auth.currentUser?.photoURL
        ? getAvatarImage(auth.currentUser.photoURL)
        : null;
      if (selfAvatar && selfAvatar.complete) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(
          player.x + player.size / 2,
          player.y + player.size / 2,
          player.size / 2,
          0,
          Math.PI * 2
        );
        ctx.clip();
        ctx.drawImage(selfAvatar, player.x, player.y, player.size, player.size);
        ctx.restore();
      } else if (playerImage.complete) {
        ctx.drawImage(playerImage, player.x, player.y, player.size, player.size);
      }

      const playerLabel =
        playerNickname || auth.currentUser?.displayName || "";
      if (playerLabel) {
        drawNameBubble(
          ctx,
          player.x + player.size / 2,
          player.y - 6,
          playerLabel,
          isUserOnline(auth.currentUser?.uid)
        );
      }

      if (!isDialogueOpen && npc.active && isPlayerNearNpc()) {
        const npcCenterX = npcPixel.x + npc.size / 2;
        const npcTopY = npcPixel.y - tileSize * 0.2;
        ctx.save();
        ctx.fillStyle = "#000000";
        ctx.font = "18px Arial, Helvetica, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "bottom";
        ctx.fillText("👋", npcCenterX, npcTopY);
        ctx.fillStyle = "#000000";
        ctx.fillText("按 Enter 互動", npcCenterX, npcTopY - 18);
        ctx.restore();
      }

      if (isDialogueOpen) {
        const boxWidth = canvas.width * 0.78;
        const boxHeight = 160;
        const boxX = (canvas.width - boxWidth) / 2;
        const boxY = (canvas.height - boxHeight) / 2;
        const textColor = "#000000";
        const subTextColor = "#000000";
        const maxTextWidth = boxWidth - 40;
        const lineHeight = 24;

        ctx.save();
        ctx.fillStyle = "rgba(255, 255, 255, 0.98)";
        ctx.fillRect(boxX, boxY, boxWidth, boxHeight);
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.strokeRect(boxX, boxY, boxWidth, boxHeight);

        ctx.textAlign = "center";
        ctx.textBaseline = "top";
        if (dialogueStage === "question") {
          ctx.fillStyle = textColor;
          ctx.font = "18px Arial, Helvetica, sans-serif";
          const questionLines = wrapText(ctx, npcQuiz.question, maxTextWidth);
          const questionY = boxY + 14;
          questionLines.forEach((line, index) => {
            ctx.fillText(line, canvas.width / 2, questionY + index * lineHeight);
          });

          const optionY =
            questionY + questionLines.length * lineHeight + 10;
          const optionCount = npcQuiz.options.length;
          const spacing =
            optionCount > 1
              ? Math.min(140, (boxWidth - 40) / (optionCount - 1))
              : 0;
          const startX =
            canvas.width / 2 - (spacing * (optionCount - 1)) / 2;

          ctx.font = "18px Arial, Helvetica, sans-serif";
          ctx.textBaseline = "middle";
          npcQuiz.options.forEach((option, index) => {
            ctx.fillStyle = index === selectedOption ? "#f1c40f" : textColor;
            ctx.fillText(option, startX + spacing * index, optionY);
          });

          ctx.fillStyle = subTextColor;
          ctx.textBaseline = "bottom";
          ctx.fillText(
            "左右選擇，Enter 確認",
            canvas.width / 2,
            boxY + boxHeight - 14
          );
        } else {
          ctx.fillStyle = textColor;
          ctx.font = "18px Arial, Helvetica, sans-serif";
          const resultLines = wrapText(ctx, resultMessage, maxTextWidth);
          const resultY = boxY + 34;
          resultLines.forEach((line, index) => {
            ctx.fillText(line, canvas.width / 2, resultY + index * lineHeight);
          });
          ctx.fillStyle = subTextColor;
          ctx.textBaseline = "bottom";
          ctx.fillText(
            "按 Enter 關閉",
            canvas.width / 2,
            boxY + boxHeight - 14
          );
        }
        ctx.restore();
      }
    };


    const loop = () => {
      update();
      render();
      if (activePrivatePartner && canAcceptCall()) {
        positionCallStart();
      }
      requestAnimationFrame(loop);
    };

    loop();
  </script>
</body>
